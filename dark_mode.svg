<svg xmlns="http://www.w3.org/2000/svg" width="820" height="460" viewBox="0 0 820 460" fill="none" xml:space="preserve" role="img" aria-label="zkwokleung terminal profile card">
  <style>
    .win  { fill: #1a1b27; stroke: #414868; }
    .bar  { fill: #24283b; }
    .barline { stroke: #414868; }
    text  { font-family: 'JetBrains Mono','Fira Code','SF Mono',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace; font-size: 17px; }
    .title { fill: #8188a5; font-size: 14px; }
    .prompt { fill: #9ece6a; }
    .path   { fill: #7dcfff; }
    .cmd    { fill: #c0caf5; }
    .out    { fill: #c0caf5; }
    .accent { fill: #bb9af7; }
    .key    { fill: #7aa2f7; }
    .str    { fill: #9ece6a; }
    .num    { fill: #ff9e64; }
    .punct  { fill: #565f89; }

    .line { clip-path: inset(0 101% 0 0); animation: type 0.5s steps(32) forwards; }
    .l1  { animation-delay: 0.30s; }
    .l2  { animation-delay: 0.85s; }
    .l3  { animation-delay: 1.45s; }
    .l4  { animation-delay: 2.00s; }
    .l5  { animation-delay: 2.45s; }
    .l6  { animation-delay: 2.90s; }
    .l7  { animation-delay: 3.35s; }
    .l8  { animation-delay: 3.80s; }
    .l9  { animation-delay: 4.25s; }
    .l10 { animation-delay: 4.70s; }
    .l11 { animation-delay: 5.15s; }
    .l12 { animation-delay: 5.60s; }

    @keyframes type { to { clip-path: inset(0 0 0 0); } }

    .caret { fill: #7dcfff; opacity: 0; animation: blink 1.05s steps(1) 6.05s infinite; }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }

    .card { opacity: 0; animation: fade 0.5s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
  </style>

  <g class="card">
