    <g class="line l2"><text x="36" y="120"><tspan class="accent">Andrew SZE-TO</tspan><tspan class="out"> · Full-Stack &amp; Game Developer</tspan><tspan class="punct">  (</tspan><tspan class="num" id="commit_data">3,414</tspan><tspan class="out"> commits · </tspan><tspan class="num" id="age_data">6y</tspan><tspan class="punct">)</tspan></text></g>

    <g class="line l3"><text x="36" y="156"><tspan class="prompt">➜</tspan><tspan class="path">  ~  </tspan><tspan class="cmd">cat skills.json</tspan></text></g>
    <g class="line l4"><text y="186"><tspan class="punct" x="36">{</tspan></text></g>
    <g class="line l5"><text y="216"><tspan class="key" x="60">"languages"</tspan><tspan class="punct" x="176">:</tspan><tspan class="punct" x="196">[</tspan><tspan class="str">"TypeScript","C#","C++","Python"</tspan><tspan class="punct">],</tspan></text></g>
    <g class="line l6"><text y="246"><tspan class="key" x="60">"frontend"</tspan><tspan class="punct" x="176">:</tspan><tspan class="punct" x="196">[</tspan><tspan class="str">"React","Next.js","Tailwind"</tspan><tspan class="punct">],</tspan></text></g>
    <g class="line l7"><text y="276"><tspan class="key" x="60">"backend"</tspan><tspan class="punct" x="176">:</tspan><tspan class="punct" x="196">[</tspan><tspan class="str">"Laravel","Express"</tspan><tspan class="punct">],</tspan></text></g>
    <g class="line l8"><text y="306"><tspan class="key" x="60">"mobile"</tspan><tspan class="punct" x="176">:</tspan><tspan class="punct" x="196">[</tspan><tspan class="str">"Flutter","Kotlin"</tspan><tspan class="punct">],</tspan></text></g>
    <g class="line l9"><text y="336"><tspan class="key" x="60">"data"</tspan><tspan class="punct" x="176">:</tspan><tspan class="punct" x="196">[</tspan><tspan class="str">"Redis","Elasticsearch","PostgreSQL","MySQL"</tspan><tspan class="punct">],</tspan></text></g>
    <g class="line l10"><text y="366"><tspan class="key" x="60">"tools"</tspan><tspan class="punct" x="176">:</tspan><tspan class="punct" x="196">[</tspan><tspan class="str">"Unity","Neovim"</tspan><tspan class="punct">]</tspan></text></g>
    <g class="line l11"><text y="396"><tspan class="punct" x="36">}</tspan></text></g>

    <g class="line l12"><text x="36" y="432"><tspan class="prompt">➜</tspan><tspan class="path">  ~  </tspan></text></g>
    <rect class="caret" x="100" y="418" width="10" height="18" rx="1"/>
  </g>
</svg>
